<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitab Shop — QA Test Plan</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --muted:#5d6570; --faint:#8b939e;
  --line:#e2e5ea; --line-soft:#eef0f3; --accent:#1f4fd8; --accent-soft:#eaf0ff;
  --pass:#0f7a3d; --pass-bg:#e7f6ec; --fail:#b3261e; --fail-bg:#fdecea;
  --block:#96620a; --block-bg:#fdf3e2; --na:#6b7280; --na-bg:#eef0f3;
  --crit:#b3261e; --high:#96620a; --med:#5d6570;
  --code-bg:#f2f4f7; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0f1216; --panel:#161a20; --ink:#e7eaee; --muted:#9aa3ae; --faint:#6f7883;
    --line:#252b33; --line-soft:#1d222a; --accent:#7ea2ff; --accent-soft:#1a2235;
    --pass:#5fd08a; --pass-bg:#12291c; --fail:#ff8a80; --fail-bg:#2c1614;
    --block:#e8b464; --block-bg:#2b2114; --na:#9aa3ae; --na-bg:#1d222a;
    --crit:#ff8a80; --high:#e8b464; --med:#9aa3ae; --code-bg:#11151a;
  }
}
[data-theme="dark"]{
  --bg:#0f1216; --panel:#161a20; --ink:#e7eaee; --muted:#9aa3ae; --faint:#6f7883;
  --line:#252b33; --line-soft:#1d222a; --accent:#7ea2ff; --accent-soft:#1a2235;
  --pass:#5fd08a; --pass-bg:#12291c; --fail:#ff8a80; --fail-bg:#2c1614;
  --block:#e8b464; --block-bg:#2b2114; --na:#9aa3ae; --na-bg:#1d222a;
  --crit:#ff8a80; --high:#e8b464; --med:#9aa3ae; --code-bg:#11151a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,kbd{font-family:var(--mono);font-size:12.5px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:14px}
.brand{padding:0 16px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.brand h1{margin:0;font-size:14px;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--faint)}
.nav{list-style:none;margin:0;padding:0 8px}
.nav li{margin:1px 0}
.nav button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);
  font:inherit;font-size:12.8px;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer}
.nav button:hover{background:var(--line-soft);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav button[aria-current="true"] .n{color:var(--accent)}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 4px;font-weight:700}

.main{min-width:0;padding:0 0 64px}
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.bar select,.bar button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.bar button:hover{border-color:var(--accent);color:var(--accent)}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{width:120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .p{background:var(--pass)} .track .f{background:var(--fail)} .track .b{background:var(--block)} .track .x{background:var(--na)}

.wrap{padding:20px}
.tabhead{margin:0 0 4px;font-size:19px;letter-spacing:-.015em}
.tabsub{margin:0 0 18px;color:var(--muted);font-size:13px;max-width:72ch}

/* ---------- case card ---------- */
.case{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.case.is-pass{border-left:3px solid var(--pass)}
.case.is-fail{border-left:3px solid var(--fail)}
.case.is-block{border-left:3px solid var(--block)}
.case.is-na{border-left:3px solid var(--na);opacity:.72}
.chead{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;cursor:pointer}
.chead:hover{background:var(--line-soft)}
.cid{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;padding-top:2px}
.ctitle{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.pri{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:3px;white-space:nowrap}
.pri.critical{color:var(--crit)} .pri.high{color:var(--high)} .pri.medium{color:var(--med)}
.state{font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.state.pass{background:var(--pass-bg);color:var(--pass)}
.state.fail{background:var(--fail-bg);color:var(--fail)}
.state.block{background:var(--block-bg);color:var(--block)}
.state.na{background:var(--na-bg);color:var(--na)}
.state.todo{background:var(--na-bg);color:var(--faint)}
.cbody{padding:0 14px 14px;border-top:1px solid var(--line-soft)}
.cbody[hidden]{display:none!important}
.sec{margin-top:13px}
.sec h4{margin:0 0 5px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.sec ol,.sec ul{margin:0;padding-left:19px}
.sec li{margin:2px 0}
.sec p{margin:0}
.why{border-left:2px solid var(--accent);padding:6px 0 6px 10px;color:var(--muted);font-size:12.5px;background:var(--accent-soft);border-radius:0 5px 5px 0;padding-right:10px}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line-soft);border-radius:6px;padding:9px 11px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.codewrap{position:relative}
.copy{position:absolute;top:6px;right:6px;font-size:10.5px;padding:3px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);cursor:pointer}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.expect{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.expect>div{background:var(--bg);border:1px solid var(--line-soft);border-radius:7px;padding:9px 11px}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;align-items:center}
.marks button{padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;font-weight:600}
.marks button:hover{border-color:currentColor}
.marks button.on.pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.marks button.on.fail{background:var(--fail-bg);color:var(--fail);border-color:var(--fail)}
.marks button.on.block{background:var(--block-bg);color:var(--block);border-color:var(--block)}
.marks button.on.na{background:var(--na-bg);color:var(--na);border-color:var(--na)}
.marks textarea{flex:1;min-width:180px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;resize:vertical;min-height:32px}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th,table.grid td{border:1px solid var(--line-soft);padding:6px 9px;text-align:left;vertical-align:top}
table.grid th{background:var(--bg);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.tablewrap{overflow-x:auto}
.empty{color:var(--faint);padding:28px 0;text-align:center}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;flex-wrap:wrap;gap:3px}
  .nav li{flex:0 0 auto}
  .navgroup{display:none}
  .wrap{padding:16px}
}
@media print{
  .side,.bar,.marks button,.copy{display:none!important}
  .app{display:block}
  .case{break-inside:avoid;border:1px solid #ccc}
  .cbody{display:block!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>Kitab Shop — QA Test Plan</h1>
      <p id="brandsub">order &amp; checkout, end to end</p>
    </div>
    <nav><ul class="nav" id="nav"></ul></nav>
  </aside>
  <main class="main">
    <div class="bar">
      <input type="search" id="q" placeholder="Search all cases…" aria-label="Search cases">
      <select id="fstate" aria-label="Filter by result">
        <option value="">All results</option>
        <option value="todo">Not run</option>
        <option value="pass">Passed</option>
        <option value="fail">Failed</option>
        <option value="block">Blocked</option>
        <option value="na">N/A</option>
      </select>
      <select id="fpri" aria-label="Filter by priority">
        <option value="">All priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
      </select>
      <div class="meter" id="meter"></div>
      <button id="expand">Expand all</button>
      <button id="exportmd">Export .md</button>
      <button id="exportjson">Export .json</button>
      <button id="theme">Theme</button>
      <button id="reset">Reset</button>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>
<script>
/* Every case below was derived from the code, not assumed. Where a case looks
   surprising, the `why` line says which invariant it protects. */
const TABS = [
 {id:"setup", group:"Start here", name:"Setup", blurb:"Get both apps running and prove you can read the database. Nothing else in this plan works until this tab is green. Examples throughout use the seeded book \u201cThe Quiet Between Waves\u201d (Paperback \u20b9399, Hardcover \u20b9599, E-book inactive) \u2014 those figures were verified against the running app on 16 Sep 2026."},
 {id:"auth", group:"Customer", name:"Auth & accounts", blurb:"Signup through to account deletion, including the branches most people skip: unverified login, resend, 2FA."},
 {id:"catalog", group:"Customer", name:"Catalogue & product", blurb:"Browsing, search, facets and the product page. Variants get their own cases — they are where pricing bugs hide."},
 {id:"cart", group:"Customer", name:"Cart & wishlist", blurb:"Cart maths, variant lines, stock blocks, Buy Now scoping, wishlist and compare."},
 {id:"coupon", group:"Customer", name:"Coupons & wallet", blurb:"Per-customer allowance, the total redemption budget, and the rule that the coupon list and checkout must never disagree."},
 {id:"cod", group:"Checkout", name:"Checkout — COD", blurb:"Cash on delivery: the OTP gate, the amount gates, and pincode serviceability failing closed."},
 {id:"razorpay", group:"Checkout", name:"Checkout — Razorpay", blurb:"Order-first prepaid flow: intent, verification, webhook, retry and the abandoned-checkout sweeper."},
 {id:"pricing", group:"Checkout", name:"Pricing & money", blurb:"The server decides every amount. These cases try to make it decide wrongly."},
 {id:"lifecycle", group:"Fulfilment", name:"Order lifecycle", blurb:"The status transition table, enforced identically in the admin dropdown and the courier webhook."},
 {id:"shipping", group:"Fulfilment", name:"Shipping & tracking", blurb:"Manual dispatch, Shiprocket lifecycle, and what the customer sees while a parcel is in transit."},
 {id:"cancel", group:"Money", name:"Cancellation & refunds", blurb:"Self-cancel, admin cancel, partial cancel, gateway refunds and manual payouts. The highest-stakes tab."},
 {id:"returns", group:"Money", name:"Returns & replacements", blurb:"The full reverse journey, including the disposition decision that separates a refund from a restock."},
 {id:"rto", group:"Money", name:"RTO", blurb:"Parcels that come back. Prepaid owes a refund; COD owes nothing."},
 {id:"inventory", group:"Fulfilment", name:"Inventory & stock", blurb:"Decrement, restock, variant-level stock and the reservation that holds units during payment."},
 {id:"admin", group:"Admin", name:"Panel & permissions", blurb:"Six roles, twenty permissions. Most of these cases are things that must NOT work."},
 {id:"reports", group:"Admin", name:"Reports & exports", blurb:"Sales, COD reconciliation, coupon usage, audit log and system health."},
 {id:"email", group:"Admin", name:"Emails & notifications", blurb:"What should land in an inbox, and what is deliberately suppressed."},
 {id:"security", group:"Hardening", name:"Security & negative", blurb:"IDOR, rate limits, signature forgery, price tampering. Assume the tester is the attacker."},
 {id:"auto", group:"Hardening", name:"Automated suites", blurb:"The 37 regression suites, the unit tests and the Playwright smoke scripts — how to run them and what they mean."},
 {id:"fixes", group:"Start here", name:"Recent fixes", blurb:"Targeted re-verification of the seven fixes shipped on 16 Sep 2026. Run this tab first after any deploy."},
];

const T = [];
const add = (tab, id, title, pri, o) => T.push(Object.assign({tab,id,title,pri}, o));

/* ============================== 1. SETUP ============================== */
add("setup","SET-01","Both servers start and talk to each other","critical",{
 pre:"Node ≥ 24, a local mongod running as replica set rs0.",
 steps:[
  "Backend: <code>cd kitab-shop-be &amp;&amp; npm install &amp;&amp; npm run dev</code>",
  "Confirm the console prints the port (default 3000) and a Mongo connection line.",
  "Frontend: <code>cd kitab-shop-fe &amp;&amp; npm install &amp;&amp; npm run dev</code> (Vite, default 5173).",
  "Open <code>http://localhost:5173</code>. The homepage renders with book covers."
 ],
 ui:"Homepage loads with images. No red errors in the browser console.",
 db:null,
 why:"Covers load from the BACKEND at /uploads. If every cover is broken but text renders, VITE_BACKEND_URL is wrong — not the catalogue."
});
add("setup","SET-02","Identify which database you are actually testing","critical",{
 pre:"Backend running.",
 steps:[
  "Run the command opposite from <code>kitab-shop-be/</code>.",
  "Write the printed database name at the top of your notes. Every query in this plan runs against it."
 ],
 ui:"—",
 admin:"—",
 cmd:`cd kitab-shop-be
node --input-type=module -e '
import "dotenv/config"; import mongoose from "mongoose";
await mongoose.connect(process.env.mango_url||process.env.mongo_url||process.env.MONGO_URI);
console.log("DB :", mongoose.connection.name);
console.log("HOST:", mongoose.connection.host+":"+mongoose.connection.port);
await mongoose.disconnect();'`,
 expect:"Host must be 127.0.0.1 or localhost. If it is a public IP, STOP — you are pointed at production.",
 why:"The local database and the production database can share a name. The host is the only reliable difference. Never run this plan against a remote host."
});
add("setup","SET-03","Open a mongosh session you can keep","high",{
 pre:"SET-02 done; you know the database name.",
 steps:["Replace <code>&lt;DB&gt;</code> with the name from SET-02.","Run the count — it should answer without error."],
 cmd:`mongosh "mongodb://127.0.0.1:27017/<DB>" --quiet --eval 'db.orders.countDocuments({})'`,
 ui:"A number prints.",
 db:"Any number is fine. You are only proving the connection works."
});
add("setup","SET-04","An admin account exists and can reach /admin","critical",{
 pre:"Backend running.",
 steps:[
  "Create or reset an admin: <code>npm run admin:upsert -- --email=admin@kitab.local --password=AdminTest12345 --roles=superAdmin</code>",
  "Log in at <code>/login</code> (or <code>/seller-login</code>) with those credentials.",
  "You should land on <code>/admin</code>."
 ],
 ui:"Redirected to the admin dashboard. Sidebar shows every section.",
 db:`db.users.findOne({email:"admin@kitab.local"},{email:1,roles:1,isVerified:1,isBlocked:1})`,
 expect:"roles contains superAdmin · isVerified true · isBlocked false",
 why:"The upsert script sets isVerified true deliberately, so a seeded admin skips email verification. A hand-made admin will be stuck at the verify screen."
});
add("setup","SET-05","A customer account exists","high",{
 pre:"—",
 steps:["Either sign up normally (AUTH-01) or use a seeded customer.","Note the email and password; you will use this account throughout."],
 ui:"Can log in and reach <code>/account</code>.",
 db:`db.users.findOne({email:"<your customer>"},{email:1,roles:1,isVerified:1})`,
 expect:"roles is ['user'] · isVerified true"
});
add("setup","SET-06","Record the current checkout settings before you change anything","high",{
 pre:"Admin logged in.",
 steps:["Run the query opposite and paste the result into your notes.","At the end of testing, restore these values."],
 cmd:`mongosh "mongodb://127.0.0.1:27017/<DB>" --quiet --eval 'printjson(db.checkoutsettings.findOne({}))'`,
 ui:"—",
 admin:"Same values visible at <code>/admin/operations?tab=checkout</code>.",
 why:"Several tabs ask you to flip codEnabled, shippingRatesEnabled and the amount limits. Without a record of the starting state you cannot put the store back."
});
add("setup","SET-07","Know how to reset between runs","medium",{
 pre:"—",
 steps:[
  "Orders cannot be deleted from the UI by design.",
  "To clear test orders for one customer, use the query opposite.",
  "Products and coupons are safer to clean by name/code prefix."
 ],
 cmd:`// DANGEROUS — check the DB name first (SET-02)
db.orders.deleteMany({ user: ObjectId("<customer id>") })`,
 ui:"—",
 why:"Cancelling an order does not remove it — it is a terminal status with compensation logic attached. Deleting rows is the only true reset, and only ever on a local database."
});

/* ============================== 2. AUTH ============================== */
add("auth","AUTH-01","Signup creates an unverified account","critical",{
 pre:"Logged out.",
 steps:["Go to <code>/signup</code>.","Register with a fresh email.","You are redirected to <code>/verify-email</code>."],
 ui:"Verify-email screen, with the email shown.",
 db:`db.users.findOne({email:"<new email>"},{email:1,isVerified:1,roles:1})`,
 expect:"isVerified false · roles ['user']"
});
add("auth","AUTH-02","An unverified account cannot log in","critical",{
 pre:"AUTH-01 done, email not yet verified.",
 steps:["Go to <code>/login</code> and use the new credentials."],
 ui:"Login refused with an 'email not verified' message and a route to resend.",
 api:"401 with code EMAIL_NOT_VERIFIED",
 why:"If this passes, every downstream gate that assumes a verified email is unguarded."
});
add("auth","AUTH-03","Verification by emailed link","high",{
 pre:"AUTH-01 done; SMTP configured or the token read from the database.",
 steps:["Open the verification link from the email.","Land on <code>/verify-email?token=…</code>; it verifies on load.","After ~3s you are sent to <code>/login</code>."],
 ui:"Success message, then redirect.",
 db:`db.users.findOne({email:"<new email>"},{isVerified:1})`,
 expect:"isVerified true"
});
add("auth","AUTH-04","Verification by OTP code","medium",{
 pre:"AUTH-01 done.",
 steps:["On <code>/verify-email</code> enter the emailed OTP instead of using the link.","Submit."],
 ui:"Same success path as the link.",
 db:`db.users.findOne({email:"<new email>"},{isVerified:1})`,
 expect:"isVerified true"
});
add("auth","AUTH-05","Resend verification is rate-limited by a cooldown","medium",{
 pre:"On the verify-email screen.",
 steps:["Press Resend.","Press it again immediately."],
 ui:"The button disables and shows a countdown; the second press is refused client-side.",
 why:"The server limit is 30 requests per 15 minutes; the cooldown exists so a customer does not burn through it by clicking."
});
add("auth","AUTH-06","Login succeeds after verification and lands by role","critical",{
 pre:"A verified customer and a verified admin.",
 steps:["Log in as the customer → expect the storefront.","Log out. Log in as the admin → expect <code>/admin</code>."],
 ui:"Customer lands on the site; admin lands on the dashboard.",
 why:"Role-based landing is decided on the client after login; a customer must never be handed an admin shell even briefly."
});
add("auth","AUTH-07","Forgot password → reset works end to end","high",{
 pre:"A verified account.",
 steps:["<code>/forgot-password</code>, submit the email.","Open the emailed reset link.","Set a new password and log in with it."],
 ui:"Reset confirmed; the old password no longer works.",
 db:"—",
 why:"The reset link uses RESET_PASSWORD_FRONTEND_URL — if that points somewhere unreachable the email is useless even though the flow 'works'."
});
add("auth","AUTH-08","Seller login rejects a non-admin","high",{
 pre:"A customer account.",
 steps:["Go to <code>/seller-login</code>.","Log in with customer credentials."],
 ui:"Force-logged-out with \"This account doesn't have admin access\".",
 why:"It is the same credential store as /login — the guard is the only thing separating the two doors."
});
add("auth","AUTH-09","A blocked admin's existing token stops working","critical",{
 pre:"Two admins; you are logged in as admin B in another browser.",
 steps:["As admin A, block admin B at <code>/admin/users</code>.","In admin B's still-open session, click any admin page."],
 ui:"Admin B is rejected — the live session does not survive the block.",
 db:`db.users.findOne({email:"<admin B>"},{isBlocked:1,isActive:1})`,
 expect:"isBlocked true",
 why:"The admin middleware re-reads the user on every request. If a blocked admin keeps working until their token expires, that check has regressed."
});
add("auth","AUTH-10","Delete my account","medium",{
 pre:"A throwaway customer account, logged in.",
 steps:["<code>/account/profile</code> → Delete Account.","Confirm the prompt."],
 ui:"Logged out; the account can no longer log in.",
 db:`db.users.findOne({email:"<throwaway>"},{deletedAt:1,isActive:1})`,
 expect:"deletedAt set (soft delete) — the row is not removed"
});

/* ============================== 3. CATALOGUE ============================== */
add("catalog","CAT-01","Product listing renders, sorts and paginates","high",{
 pre:"Catalogue seeded.",
 steps:["<code>/products</code>.","Change sort to Price: low → high; confirm the first item is the cheapest.","Page forward and back."],
 ui:"Grid re-orders correctly; pagination resets to page 1 when a filter changes.",
 why:"Filtering and sorting are CLIENT-side over the full catalogue preloaded at app start. A slow first paint is expected; wrong ordering is not."
});
add("catalog","CAT-02","Category facets narrow the list","medium",{
 pre:"—",
 steps:["Open a category page <code>/category/:id</code>.","Apply a price range, a minimum rating, an author and a language.","Clear them one at a time."],
 ui:"Counts shrink and grow consistently; clearing restores the full list."
});
add("catalog","CAT-03","Format facet lists only ACTIVE variants","high",{
 pre:"A product with an inactive variant (the seed marks E-book inactive).",
 steps:["Open the category page and inspect the Format facet."],
 ui:"E-book does NOT appear as a filterable format.",
 why:"An inactive variant is unsellable. Offering it as a filter leads a customer to a product they cannot buy."
});
add("catalog","CAT-04","Search returns results and logs the click","medium",{
 pre:"—",
 steps:["Type a book title into the header search.","Pick a suggestion.","Land on the product page."],
 ui:"Suggestions appear above a minimum query length; selecting one navigates to the product.",
 db:`db.searchanalytics.find({}).sort({_id:-1}).limit(3)`,
 expect:"A row recording the search term"
});
add("catalog","CAT-05","Product page shows the selected variant's price and MRP","critical",{
 pre:"Use <strong>The Quiet Between Waves</strong> from the seeded catalogue — Paperback ₹399 (MRP ₹599), Hardcover ₹599 (MRP ₹899), E-book inactive.",

<script>
(function(){
"use strict";
const KEY = "kitab-qa-testplan-v1";
const STATES = ["pass","fail","block","na"];
const LABEL = {pass:"Pass", fail:"Fail", block:"Blocked", na:"N/A", todo:"Not run"};

/* localStorage may be unavailable (private window, blocked site data). The page
   must render and stay usable either way, so every access is guarded. */
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (_) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (_) {} };
const rec = (id) => store[id] || (store[id] = {state:"", note:""});

let active = TABS[0].id;
let openIds = new Set();
let expandedAll = false;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const casesFor = (tab) => T.filter(c => c.tab === tab);

function matches(c){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fs = document.getElementById("fstate").value;
  const fp = document.getElementById("fpri").value;
  if (fp && c.pri !== fp) return false;
  const st = (store[c.id] && store[c.id].state) || "todo";
  if (fs && st !== fs) return false;
  if (q) {
    const hay = [c.id, c.title, c.pre, c.ui, c.admin, c.api, c.db, c.expect, c.why, c.note, c.cmd,
                 (c.steps||[]).join(" ")].filter(Boolean).join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function tally(list){
  const t = {pass:0, fail:0, block:0, na:0, todo:0};
  list.forEach(c => { const s = (store[c.id] && store[c.id].state) || "todo"; t[s]++; });
  return t;
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let group = null;
  TABS.forEach(tab => {
    if (tab.group !== group) {
      group = tab.group;
      nav.appendChild(el(`<li class="navgroup">${esc(group)}</li>`));
    }
    const list = casesFor(tab.id);
    const t = tally(list);
    const done = list.length - t.todo;
    const li = el(`<li><button type="button" aria-current="${tab.id===active}">
      <span>${esc(tab.name)}</span><span class="n">${done}/${list.length}</span></button></li>`);
    li.querySelector("button").addEventListener("click", () => { active = tab.id; render(); window.scrollTo(0,0); });
    nav.appendChild(li);
  });
}

function renderMeter(){
  const t = tally(T);
  const total = T.length;
  const pct = (n) => (n/total*100).toFixed(2) + "%";
  document.getElementById("meter").innerHTML =
    `<span class="track">
       <i class="p" style="width:${pct(t.pass)}"></i><i class="f" style="width:${pct(t.fail)}"></i>
       <i class="b" style="width:${pct(t.block)}"></i><i class="x" style="width:${pct(t.na)}"></i>
     </span>
     <span>${t.pass}/${total} passed${t.fail?` · <strong style="color:var(--fail)">${t.fail} failed</strong>`:""}${t.block?` · ${t.block} blocked`:""}</span>`;
}

function codeBlock(text){
  const wrap = el(`<div class="codewrap"><pre>${esc(text)}</pre><button class="copy" type="button">Copy</button></div>`);
  wrap.querySelector(".copy").addEventListener("click", (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200); };
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } catch (_) { fallback(); }
    function fallback(){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (_) { btn.textContent = "Select manually"; }
      document.body.removeChild(ta);
    }
  });
  return wrap;
}

function renderCase(c){
  const r = rec(c.id);
  const st = r.state || "todo";
  const cls = st === "todo" ? "" : " is-" + st;
  const node = el(`<article class="case${cls}">
    <header class="chead">
      <span class="cid">${esc(c.id)}</span>
      <span class="ctitle">${esc(c.title)}</span>
      <span class="pri ${c.pri}">${c.pri}</span>
      <span class="state ${st}">${LABEL[st]}</span>
    </header>
    <div class="cbody" hidden></div>
  </article>`);

  const head = node.querySelector(".chead");
  const body = node.querySelector(".cbody");
  const open = openIds.has(c.id) || expandedAll;
  body.hidden = !open;

  head.addEventListener("click", () => {
    if (body.hidden) { openIds.add(c.id); } else { openIds.delete(c.id); }
    body.hidden = !body.hidden;
  });

  const sec = (h, inner) => {
    const s = el(`<div class="sec"><h4>${esc(h)}</h4></div>`);
    if (typeof inner === "string") s.appendChild(el(`<div>${inner}</div>`)); else s.appendChild(inner);
    body.appendChild(s);
  };

  if (c.pre) sec("Precondition", `<p>${c.pre}</p>`);
  if (c.steps) sec("Steps", `<ol>${c.steps.map(s => `<li>${s}</li>`).join("")}</ol>`);
  if (c.cmd) sec("Run this", codeBlock(c.cmd));

  const boxes = [];
  if (c.ui && c.ui !== "—") boxes.push(`<div><h4 style="margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)">Expected — customer</h4>${c.ui}</div>`);
  if (c.admin && c.admin !== "—") boxes.push(`<div><h4 style="margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)">Expected — admin</h4>${c.admin}</div>`);
  if (c.api) boxes.push(`<div><h4 style="margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)">Expected — API</h4>${c.api}</div>`);
  if (boxes.length) { const s = el(`<div class="sec"><div class="expect">${boxes.join("")}</div></div>`); body.appendChild(s); }

  if (c.db && c.db !== "—") {
    sec("Check the database", codeBlock(c.db));
    if (c.expect) body.appendChild(el(`<div class="sec"><h4>Expected values</h4><p>${c.expect}</p></div>`));
  } else if (c.expect) {
    sec("Expected values", `<p>${c.expect}</p>`);
  }

  if (c.table) {
    const t = c.table;
    sec("Reference", `<div class="tablewrap"><table class="grid">
      <thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${t.rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`);
  }
  if (c.why) body.appendChild(el(`<div class="sec"><div class="why">${c.why}</div></div>`));
  if (c.note) body.appendChild(el(`<div class="sec"><h4>Note</h4><p>${c.note}</p></div>`));

  const marks = el(`<div class="marks">
    ${STATES.map(s => `<button type="button" class="${s}${r.state===s?" on":""}" data-s="${s}">${LABEL[s]}</button>`).join("")}
    <textarea placeholder="Notes, actual result, screenshot name…">${esc(r.note||"")}</textarea>
  </div>`);
  marks.querySelectorAll("button").forEach(b => b.addEventListener("click", (e) => {
    e.stopPropagation();
    const s = b.dataset.s;
    r.state = (r.state === s) ? "" : s;
    save(); openIds.add(c.id); render();
  }));
  const ta = marks.querySelector("textarea");
  ta.addEventListener("click", e => e.stopPropagation());
  ta.addEventListener("input", () => { r.note = ta.value; save(); });
  body.appendChild(marks);

  return node;
}

function render(){
  renderNav();
  renderMeter();
  const wrap = document.getElementById("wrap");
  wrap.innerHTML = "";
  const q = document.getElementById("q").value.trim();

  // A search spans EVERY tab. Searching inside one tab is close to useless when you
  // are trying to find the case that covers a thing you just broke.
  if (q) {
    const hits = T.filter(matches);
    wrap.appendChild(el(`<h2 class="tabhead">Search</h2>`));
    wrap.appendChild(el(`<p class="tabsub">${hits.length} case${hits.length===1?"":"s"} matching
      &ldquo;${esc(q)}&rdquo; across all ${TABS.length} flows.</p>`));
    if (!hits.length) { wrap.appendChild(el(`<p class="empty">Nothing matches.</p>`)); return; }
    let lastTab = null;
    hits.forEach(c => {
      if (c.tab !== lastTab) {
        lastTab = c.tab;
        const tb = TABS.find(t => t.id === c.tab);
        wrap.appendChild(el(`<h3 style="margin:18px 0 8px;font-size:12px;text-transform:uppercase;
          letter-spacing:.07em;color:var(--faint)">${esc(tb.name)}</h3>`));
      }
      wrap.appendChild(renderCase(c));
    });
    return;
  }

  const tab = TABS.find(t => t.id === active);
  const all = casesFor(active);
  const shown = all.filter(matches);
  const t = tally(all);
  wrap.appendChild(el(`<h2 class="tabhead">${esc(tab.name)}</h2>`));
  wrap.appendChild(el(`<p class="tabsub">${esc(tab.blurb)}</p>`));
  wrap.appendChild(el(`<p class="tabsub" style="margin-top:-12px;font-size:12px">
    ${all.length} cases · ${t.pass} passed · ${t.fail} failed · ${t.block} blocked · ${t.na} n/a · ${t.todo} not run
    ${shown.length !== all.length ? ` — showing ${shown.length} after filters` : ""}</p>`));
  if (!shown.length) { wrap.appendChild(el(`<p class="empty">Nothing matches the current filters.</p>`)); return; }
  shown.forEach(c => wrap.appendChild(renderCase(c)));
}

/* ---------- export ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toMarkdown(){
  const t = tally(T);
  let out = `# Kitab Shop — QA run\n\n_${new Date().toISOString()}_\n\n`;
  out += `**${t.pass} passed · ${t.fail} failed · ${t.block} blocked · ${t.na} n/a · ${t.todo} not run** (of ${T.length})\n`;
  if (t.fail) {
    out += `\n## Failures\n\n`;
    T.filter(c => (store[c.id]||{}).state === "fail").forEach(c => {
      out += `- **${c.id}** ${c.title}\n`;
      if ((store[c.id]||{}).note) out += `  - ${store[c.id].note.replace(/\n/g," ")}\n`;
    });
  }
  TABS.forEach(tab => {
    const list = casesFor(tab.id);
    out += `\n## ${tab.name}\n\n| ID | Case | Priority | Result | Notes |\n|---|---|---|---|---|\n`;
    list.forEach(c => {
      const r = store[c.id] || {};
      out += `| ${c.id} | ${c.title.replace(/\|/g,"\\|")} | ${c.pri} | ${LABEL[r.state||"todo"]} | ${(r.note||"").replace(/\n/g," ").replace(/\|/g,"\\|")} |\n`;
    });
  });
  return out;
}

/* ---------- wiring ---------- */
["q","fstate","fpri"].forEach(id => document.getElementById(id).addEventListener("input", render));
document.getElementById("expand").addEventListener("click", (e) => {
  expandedAll = !expandedAll;
  if (!expandedAll) openIds.clear();
  e.currentTarget.textContent = expandedAll ? "Collapse all" : "Expand all";
  render();
});
document.getElementById("exportmd").addEventListener("click", () =>
  download("kitab-qa-run.md", toMarkdown(), "text/markdown"));
document.getElementById("exportjson").addEventListener("click", () =>
  download("kitab-qa-run.json", JSON.stringify({
    exportedAt: new Date().toISOString(),
    summary: tally(T),
    results: T.map(c => ({id:c.id, tab:c.tab, title:c.title, priority:c.pri,
      state:(store[c.id]||{}).state||"todo", note:(store[c.id]||{}).note||""}))
  }, null, 2), "application/json"));
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Clear every recorded result and note? This cannot be undone.")) return;
  store = {}; save(); render();
});
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const next = now === "dark" ? "light" : now === "light" ? "" : "dark";
  if (next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
  try { localStorage.setItem(KEY + "-theme", next); } catch (_) {}
});
try {
  const th = localStorage.getItem(KEY + "-theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
} catch (_) {}

document.getElementById("brandsub").textContent = T.length + " cases across " + TABS.length + " flows";
render();
})();
</script>
